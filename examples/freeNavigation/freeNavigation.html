<html>
<head>
    <title>Free Navigation | OpenGlobus Example</title>
    <meta name="description" content="OpenGlobus example: Free-flight camera navigation over the Grand Canyon."/>
    <meta name="keywords" content="FreeNavigation, camera, control, Grand Canyon, TimelineControl, LayerSwitcher"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css" type="text/css"/>
</head>

<body>
<div id="globus" style="width:100%;height:100%"></div>
<script type="module" id="og-sandbox-script">
    "use strict";

    import {
        Bing,
        Globe,
        GlobusRgbTerrain,
        LonLat,
        OpenStreetMap,
        control
    } from "../../external/og/lib/og.es.js";

    const timelineTime = new Date();
    const osm = new OpenStreetMap();
    const bing = new Bing(null, {visibility: false});

    const globe = new Globe({
        target: "globus",
        name: "Earth",
        terrain: new GlobusRgbTerrain(),
        layers: [bing, osm],
        sun: {
            stopped: true
        },
        resourcesSrc: "../../external/og/lib/res",
        fontsSrc: "../../external/og/lib/res/fonts"
    });

    globe.planet.viewLonLat(
        new LonLat(-112.18, 36.03, 5000),
        new LonLat(-112.14, 36.06, 1800)
    );

    globe.planet.addControls([
        new control.TimelineControl({current: timelineTime}),
        new control.LayerSwitcher()
    ]);

    const freeNavigation = new control.FreeNavigation({
        autoActivate: false,
        showInfo: true,
        speed: 200
    });

    globe.planet.addControl(freeNavigation);

</script>
</body>
</html>
