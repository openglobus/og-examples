<html>
<head>
    <title>GeoTIFF Local File | OpenGlobus Example</title>
    <meta name="description"
          content="OpenGlobus example: open a GeoTIFF (COG) from the local disk with a file input, without uploading it anywhere."/>
    <meta name="keywords" content="GeoTIFF, COG, local file, File, Blob, proj4, EPSG:6582, GeoTIFFLayer, Layer"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css">
    <!-- proj4 is needed for the files in a projection other than WGS84, Web Mercator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
</head>

<body>
<div id="globus" style="width:100%;height:100%"></div>

<div style="position:absolute;top:10px;left:10px;background-color:white;padding:10px;">
    <input type="file" id="file" accept=".tif,.tiff"/>
    <p id="info" style="margin:10px 0 0 0;max-width:280px;">Choose a GeoTIFF file from your disk</p>
</div>

<script type="module" id="og-sandbox-script">
    import {
        Globe,
        GlobusRgbTerrain,
        OpenStreetMap,
        GeoTIFFLayer
    } from "../../external/og/lib/og.es.js";

    function isBuiltInProjection(code) {
        return code === 4326 || code === 3857 || code === 900913 ||
            (code > 32600 && code <= 32660) || (code > 32700 && code <= 32760);
    }

    async function defineProjection(code) {
        var name = "EPSG:" + code;
        if (isBuiltInProjection(code) || proj4.defs(name)) {
            return false;
        }
        var response = await fetch("https://epsg.io/" + code + ".proj4");
        if (!response.ok) {
            throw new Error("Cannot load the definition for " + name);
        }

        var definition = (await response.text()).trim();
        if (definition.indexOf("+proj=") !== 0) {
            throw new Error("No projection definition found for " + name);
        }

        proj4.defs(name, definition);
        return true;
    }

    var globus = new Globe({
        target: "globus",
        name: "Earth",
        terrain: new GlobusRgbTerrain(),
        layers: [new OpenStreetMap()],
        resourcesSrc: "../../external/og/lib/res",
        fontsSrc: "../../external/og/lib/res/fonts"
    });

    var info = document.getElementById("info");
    var cog = null;

    function createLayer(file) {
        return new GeoTIFFLayer(file.name, {
            src: file,
            renderOptions: {
                resampleMethod: "bilinear"
            }
        });
    }

    async function openFile(file) {
        if (!file) {
            return;
        }

        if (cog) {
            cog.remove();
            cog = null;
        }

        info.innerHTML = "Reading " + file.name + "...";
        var layer = createLayer(file);

        try {
            var metadata = await layer.whenReady();
            if (await defineProjection(metadata.crsCode)) {
                layer.remove();
                layer = createLayer(file);
                await layer.whenReady();
            }

            cog = layer;
            globus.planet.addLayer(layer);
            globus.planet.flyExtent(layer.getExtent());
        } catch (err) {
            info.innerHTML = "Cannot load " + file.name + ":<br/>" + err.message;
            layer.remove();
            if (cog === layer) {
                cog = null;
            }
        }
    }

    document.getElementById("file").addEventListener("change", function (e) {
        openFile(e.target.files[0]);
    });
</script>
</body>

</html>
