<html>

<head>
    <title>Drag and Drop | OpenGlobus Example</title>
    <meta charset="utf-8">
    <meta name="description" content="OpenGlobus example: drag and drop 3d models onto the Moon." />
    <meta name="keywords" content="Moon, drag and drop, gltf, glb, obj, Gltf, Object3d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css" type="text/css" />
    <script
        type="text/javascript"
        src="https://www.gstatic.com/draco/versioned/decoders/1.5.7/draco_decoder.js"
    ></script>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #app {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Centered hint over the map */
        #dnd-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.8);
            font: 16px/1.4 Arial, Helvetica, sans-serif;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
        }
    </style>
</head>

<body>
<div id="app"></div>
<script type="module" id="og-sandbox-script">
    import {
        Globe,
        LonLat,
        CubeRgbTerrain,
        EquiangularCubeQuadTreeStrategy,
        Gltf,
        XYZ,
        moon,
        control,
        ui
    } from "../../external/og/lib/og.es.js";

    DracoDecoderModule().then((decoderModule) => {
        Gltf.connectDracoDecoderModule(decoderModule);
    });

    const app = document.getElementById("app");

    const dockManager = new ui.DockManager({
        host: app
    });

    const globeDialog = new ui.Dialog({
        title: "Moon",
        dock: "center",
        hideToolbar: true
    });

    globeDialog.appendTo(app);
    dockManager.attach(globeDialog);

    // The Moon of the Moon example: the og-tiler tiles of the six cube faces
    const sat = new XYZ("LROC WAC 100m", {
        isBaseLayer: true,
        pickingEnabled: false,
        url: "https://{s}.terrain.openglobus.org/moon/sat_cube/{f}/{z}/{x}/{y}.webp",
        visibility: true,
        maxNativeZoom: 7,
        attribution: "Lunar Reconnaissance Orbiter - LROC WAC Global Morphology Mosaic 100m"
    });

    const terrain = new CubeRgbTerrain("LOLA + SLDEM", {
        url: "https://{s}.terrain.openglobus.org/moon/dem_cube/{f}/{z}/{x}/{y}.webp",
        maxNativeZoom: 7,
        maxZoom: 10,
        minHeight: -10000,
        resolution: 0.1,
        maxHeight: 10800,
        attribution: `Terrain: <a href="https://astrogeology.usgs.gov/search/map/moon_lro_lola_dem_118m" target="_blank">LRO LOLA DEM 118m</a>, ` +
            `<a href="https://astrogeology.usgs.gov/search/map/moon_lro_lola_selene_kaguya_tc_dem_merge_60n60s_59m" target="_blank">LRO LOLA - SELENE Kaguya TC DEM Merge 60N60S 59m</a>`
    });

    let globe = new Globe({
        name: "moon",
        ellipsoid: moon,
        quadTreeStrategyPrototype: EquiangularCubeQuadTreeStrategy,
        target: globeDialog.container,
        maxAltitude: 5841727,
        terrain: terrain,
        layers: [sat],
        nightTextureSrc: null,
        specularTextureSrc: null,
        atmosphereEnabled: false,
        sun: {
            dateTime: new Date(new Date().setUTCHours(11, 0, 0, 0))
        },
        uiContainer: app
    });

    globe.planet.renderer.controls.SimpleSkyBackground.colorOne = "rgb(0, 0, 0)";
    globe.planet.renderer.controls.SimpleSkyBackground.colorTwo = "rgb(0, 0, 0)";

    const dragAndDrop = new control.DragAndDrop();
    globe.planet.addControl(dragAndDrop);

    // Low oblique view: the look point is on the ground 126 m ahead and 82 m below the eye, which
    // tilts the camera by about 33 degrees down. The ground is 1858.6 m there, 1876 m under the eye.
    const EYE = new LonLat(17.4027454513517, -5.765216799989668, 1940.2);
    const LOOK = new LonLat(17.4038363, -5.7612121, 1858.6);

    globe.planet.camera.setLonLat(EYE, LOOK);

    let entityEditor = new control.EntityEditor({ visibility: true });
    let entityTree = new control.EntityTree({ entityEditor, visibility: true });

    globe.planet.addControl(entityEditor);
    globe.planet.addControl(entityTree);

    dockManager.dock(entityTree._dialog, "right", "start");
    dockManager.dock(entityEditor._dialog, "right", "end");

    entityEditor.events.on("select", (entity) => {
        entityTree.addEntity(entity);
    });

    // Centered hint, hidden after the first object is added
    const hint = document.createElement("div");
    hint.id = "dnd-hint";
    hint.textContent = "Drag and drop a GLTF, GLB or OBJ model onto the Moon";
    globeDialog.container.appendChild(hint);

    const hideHint = () => {
        hint.remove();
        dragAndDrop.geoObjectsLayer.events.off("entityadd", hideHint);
        dragAndDrop.markersLayer.events.off("entityadd", hideHint);
    };
    dragAndDrop.geoObjectsLayer.events.on("entityadd", hideHint);
    dragAndDrop.markersLayer.events.on("entityadd", hideHint);

    window.globe = globe;
</script>
</body>

</html>
