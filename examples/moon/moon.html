<html>
<head>
    <title>Moon | OpenGlobus Example</title>
    <meta charset="utf-8"/>
    <meta name="description"
          content="OpenGlobus example: Moon on the equiangular cube quad tree, the terrain and the imagery are the og-tiler tiles of the six cube faces."/>
    <meta name="keywords"
          content="Planet, Moon, Entity, Vector, Geometry, geoJson, Geology, SkyBox, cube, EquiangularCubeQuadTreeStrategy, CubeRgbTerrain, og-tiler, webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css" type="text/css"/>
    <style>
        .info {
            position: absolute;
            bottom: 40px;
            left: 10px;
            z-index: 10;
            pointer-events: none;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 14px;
        }

        .info:empty {
            display: none;
        }
    </style>
</head>
<body style="margin:0;">
<div id="globus" style="width:100%;height:100%"></div>
<div id="info" class="info"></div>
<script type="module" id="og-sandbox-script">

    'use strict';

    import {
        Globe,
        XYZ,
        control,
        CubeRgbTerrain,
        EquiangularCubeQuadTreeStrategy,
        moon,
        Entity,
        Vector,
        LonLat,
        GeoImage,
        scene
    } from "../../external/og/lib/og.es.js";

    let boot = new GeoImage("appolo11-bootprint", {
        src: "./Apollo_11_bootprint.jpg",
        corners: [[23.472860008891054, 0.6741784451421893], [23.472873082709846, 0.6742068883279126], [23.47290553091237, 0.6741923147363605], [23.472892671128694, 0.674164039580197]],
        visibility: true,
        isBaseLayer: false,
        pickingEnabled: false,
        opacity: 1.0
    });

    const mountains = new Vector("Mountains", {
        pickingEnabled: false,
        fading: true,
        minZoom: 4,
        scaleByDistance: [0, 0, 3500000],
    });

    const craters = new Vector("Craters", {
        pickingEnabled: false,
        fading: true,
        scaleByDistance: [0, 0, 15000000],
    });

    const lacus = new Vector("Lakes", {
        pickingEnabled: false,
        fading: true,
        minZoom: 4
    });

    const maria = new Vector("Seas And Oceans", {
        pickingEnabled: false,
        fading: true,
        maxZoom: 8,
        scaleByDistance: [0, 0, 15000000],
    });

    const vallis = new Vector("Valleys", {
        pickingEnabled: false,
        fading: true,
        scaleByDistance: [0, 0, 15000000],
    });

    // The units of the Unified Geologic Map of the Moon in their colors of the map, geology.geojson
    const geology = new Vector("Geology", {
        visibility: false,
        isBaseLayer: false,
        attribution: `Geology: <a href="https://astrogeology.usgs.gov/search/map/unified_geologic_map_of_the_moon_1_5m_2020" target="_blank">Unified Geologic Map of the Moon, 1:5M, 2020</a>`
    });

    // Tiles of og-tiler, <face>/<z>/<x>/<y>.webp, the face is segment.tileGroup:
    //   ./tif2tiles.sh --s_file Lunar_LRO_LOLA_Global_LDEM_118m_Mar2014.tif --dest ./dem_cube --zoom 0-7 --strategy equiangular
    //   ./tif2tiles.sh --s_file Lunar_LRO_LOLAKaguya_DEMmerge_60N60S_512ppd.tif --dest ./dem_cube --zoom 0-8 --strategy equiangular
    //   ./tif2tiles.sh --s_file Lunar_LRO_LROC-WAC_Mosaic_global_100m_June2013.tif --dest ./sat_cube --zoom 0-7 \
    //       --strategy equiangular --norgbify

    const sat = new XYZ("LROC WAC 100m", {
        isBaseLayer: true,
        pickingEnabled: false,
        url: "https://{s}.terrain.openglobus.org/moon/sat_cube/{f}/{z}/{x}/{y}.webp",
        visibility: true,
        maxNativeZoom: 7,
        attribution: "Lunar Reconnaissance Orbiter - LROC WAC Global Morphology Mosaic 100m",
    });

    // LOLA heights up to the zoom 7 everywhere, SLDEM ones of the zoom 8 between 60N and 60S
    const terrain = new CubeRgbTerrain("LOLA + SLDEM", {
        url: "https://{s}.terrain.openglobus.org/moon/dem_cube/{f}/{z}/{x}/{y}.webp",
        maxNativeZoom: 7,
        maxZoom: 10,
        minHeight: -10000,
        resolution: 0.1,
        maxHeight: 10800,
        attribution: `Terrain: <a href="https://astrogeology.usgs.gov/search/map/moon_lro_lola_dem_118m" target="_blank">LRO LOLA DEM 118m</a>, ` +
            `<a href="https://astrogeology.usgs.gov/search/map/moon_lro_lola_selene_kaguya_tc_dem_merge_60n60s_59m" target="_blank">LRO LOLA - SELENE Kaguya TC DEM Merge 60N60S 59m</a>`
    });

    window.globe = new Globe({
        ellipsoid: moon,
        name: "moon",
        quadTreeStrategyPrototype: EquiangularCubeQuadTreeStrategy,
        target: "globus",
        maxAltitude: 5841727,
        terrain: terrain,
        layers: [sat, geology, boot, mountains, craters, maria, vallis, lacus],
        nightTextureSrc: null,
        specularTextureSrc: null,
        atmosphereEnabled: false,
        // gamma: 2.7,
        // exposure: 1,
        fontsSrc: "./fonts",
        navigation: {
            mode: "free"
        },
        skybox: new scene.SkyBox({
            px: "./px.webp",
            nx: "./nx.webp",
            py: "./py.webp",
            ny: "./ny.webp",
            pz: "./pz.webp",
            nz: "./nz.webp"
        })
    });

    window.boot = boot;

    globe.planet.addControl(new control.TimelineControl());
    globe.planet.addControl(new control.LayerSwitcher());
    globe.planet.addControl(new control.OrthoSwitcher());
    globe.planet.addControl(new control.ElevationProfileControl());
    globe.planet.addControl(new control.RulerSwitcher({
        ignoreTerrain: false
    }));

    globe.planet.renderer.controls.SimpleSkyBackground.deactivate();

    const GEOLOGY_ALPHA = 0.45;
    const GEOLOGY_HOVER_ALPHA = 0.8;
    const info = document.getElementById("info");
    let units = {};

    const unitRgb = (unit) => [1, 3, 5].map((i) => parseInt(units[unit].color.slice(i, i + 2), 16) / 255);

    fetch("./geology.geojson").then((r) => r.json()).then((data) => {
        units = data.units;
        geology.addEntities(data.features.map((f) => new Entity({
            properties: f.properties,
            geometry: {
                type: f.geometry.type,
                coordinates: f.geometry.coordinates,
                style: {
                    fillColor: [...unitRgb(f.properties.unit), GEOLOGY_ALPHA],
                    lineWidth: 0
                }
            }
        })));
    });

    geology.events.on("mouseenter", (e) => {
        const unit = e.pickingObject.properties.unit;
        e.pickingObject.geometry.setFillColor(...unitRgb(unit), GEOLOGY_HOVER_ALPHA);
        info.textContent = `${unit} · ${units[unit].name}`;
    });
    geology.events.on("mouseleave", (e) => {
        e.pickingObject.geometry.setFillColor(...unitRgb(e.pickingObject.properties.unit), GEOLOGY_ALPHA);
        info.textContent = "";
    });
    geology.events.on("lclick", (e) => {
        globe.planet.flyExtent(e.pickingObject.geometry.getExtent());
    });


    fetch("./mountains.json").then((r) => r.json()).then((data) => {
        let entities = data.features.map((f) => createLabelEntity(
            new LonLat(f.geometry.coordinates[0], f.geometry.coordinates[1]),
            f.properties["Feature Name"],
            0,
            0,
            30 + 3,
            "Ephesis-Regular",
            30,
            true,
            "rgb(355,355,355)")
        );
        mountains.setEntities(entities);
    });

    fetch("./craters.json").then((r) => r.json()).then((data) => {
        let entities = data.features.map((f) => createLabelEntity(
            new LonLat(f.geometry.coordinates[0], f.geometry.coordinates[1]),
            `${f.properties.name} ${f.properties.diameter} km`,
            0,
            0.12,
            0,
            "Karla-Medium",
            16,
            false,
            "rgba(255,165,48,1.0)")
        );
        craters.setEntities(entities);
    });

    fetch("./lacus.json").then((r) => r.json()).then((data) => {
        let entities = data.features.map((f) => createLabelEntity(
            new LonLat(f.geometry.coordinates[0], f.geometry.coordinates[1]),
            f.properties.name,
            0,
            0,
            26 + 3,
            "Karla-Light",
            26,
            false,
            "rgba(155,155,355,0.85)",
            15000)
        );
        lacus.setEntities(entities);
    });

    fetch("./mare.json").then((r) => r.json()).then((data) => {
        let entities = data.features.map((f) => createLabelEntity(
            new LonLat(f.geometry.coordinates[0], f.geometry.coordinates[1]),
            f.properties.description.toUpperCase(),
            0.2,
            0,
            35 + 3,
            "Karla-Light",
            35,
            false,
            "rgba(155,155,355,0.65)",
            15000)
        );
        maria.setEntities(entities);
    });

    fetch("./vallis.json").then((r) => r.json()).then((data) => {
        let entities = data.features.map((f) => createLabelEntity(
            new LonLat(f.geometry.coordinates[0], f.geometry.coordinates[1]),
            f.properties.name,
            0,
            0,
            21 + 3,
            "Karla-Italic",
            21,
            false,
            "rgba(255,196,137,1.0)",
            12000)
        );
        vallis.setEntities(entities);
    });

    function createLabelEntity(
        lonlat,
        text,
        letterSpacing = 0,
        outline = 0,
        offsetY = 0,
        fontFace = "Ephesis-Regular",
        fontSize = 21,
        showSpin = true,
        color = "white",
        forceHeight
    ) {
        const ell = globe.planet.ellipsoid;

        let ll = new LonLat(lonlat.lon, lonlat.lat, forceHeight != undefined ? forceHeight : 15000);

        let res = new Entity({
            lonlat: ll,
            label: {
                size: fontSize,
                face: fontFace,
                letterSpacing: letterSpacing,
                outline: outline,
                outlineColor: "rgba(0,0,0,0.89)",
                text: text,
                align: "center",
                offset: [0, offsetY],
                color: color
            }
        });

        if (!forceHeight) {
            terrain.getHeightAsync(ll, (h) => {

                ll.height = h + 10000;

                if (showSpin) {
                    let ray = new Entity({
                        ray: {
                            startPosition: ell.lonLatToCartesian(new LonLat(ll.lon, ll.lat, h)),
                            endPosition: ell.lonLatToCartesian(ll),
                            startColor: "rgba(255,255,255,0.7)",
                            endColor: "rgba(255,255,255,0.0)",
                            thickness: 3
                        }
                    });
                    res.appendChild(ray);
                }

                res.setLonLat(ll);
            });
        }

        return res;
    }
</script>
</body>
</html>
