<html>
<head>
    <title>Video Projector | OpenGlobus Example</title>
    <meta name="description"
          content="OpenGlobus example: three projectors over the Alps projecting a video, an image and a texture drawn by a shader onto the terrain."/>
    <meta name="keywords"
          content="Projector, DepthCamera, EntityEditor, video, image, texture, shader, ShaderProgram, Framebuffer, source, sourceEnabled, projection"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css" type="text/css"/>
</head>

<body>
<div id="globus" style="width:100%;height:100%"></div>

<script type="module" id="og-sandbox-script">
    "use strict";

    import {
        Bing,
        Entity,
        Framebuffer,
        Globe,
        GlobusRgbTerrain,
        LonLat,
        Object3d,
        OpenStreetMap,
        Projector,
        ShaderProgram,
        Vector,
        control
    } from "../../external/og/lib/og.es.js";

    const objects = new Vector("Objects", {
        scaleByDistance: [1, 1, 1]
    });

    const globe = new Globe({
        target: "globus",
        name: "Earth",
        terrain: new GlobusRgbTerrain(),
        layers: [new Bing(null), new OpenStreetMap(null, {visibility: false}), objects],
        atmosphereEnabled: true,
        resourcesSrc: "../../external/og/lib/res",
        fontsSrc: "../../external/og/lib/res/fonts"
    });

    globe.planet.viewLonLat(new LonLat(9.17, 46.28, 22000), new LonLat(9.17, 46.47, 0));

    globe.planet.addControls([
        new control.LayerSwitcher(),
        new control.EntityEditor({editMode: "yaw"})
    ]);

    // A plain white cube in front of the first projector
    objects.add(new Entity({
        name: "screen-cube",
        lonlat: new LonLat(9.08, 46.455, 5000),
        independentPicking: true,
        geoObject: {
            tag: "screen-cube",
            object3d: Object3d.createCube(1000, 1000, 1000).setColor("white")
        }
    }));

    //
    // Sources
    //

    function createVideo(src) {
        const video = document.createElement("video");
        video.src = src;
        video.crossOrigin = "anonymous";
        video.loop = true;
        video.muted = true;
        video.playsInline = true;
        video.autoplay = true;
        video.play().catch((error) => {
            console.warn(`Unable to autoplay ${src}`, error);
        });
        return video;
    }

    function createImage(src) {
        const image = new Image();
        image.crossOrigin = "anonymous";
        image.src = src;
        return image;
    }

    const renderer = globe.planet.renderer;

    function setProjectorLens(projector, width, height) {
        const camera = projector.depthCamera.camera;
        camera.setViewportSize(width, height);
        camera.setHorizontalViewAngle(30);
        camera.update();
    }

    //
    // Video projector. An HTMLVideoElement is uploaded on every new video frame.
    //
    const videoProjector = new Projector({
        enabled: true,
        depthCamera: {
            showFrustum: true,
            // The footprint reads the depth map back to the CPU every frame, it is slow.
            showFootprint: false,
            frustumColor: "rgba(255,120,120,0.7)",
            near: 100,
            far: 100000,
            depthBiasWorld: 100.0,   // meters
            normalBias: 0.45,        // 0.2 .. 1.0
            lonLat: [9.08, 46.45, 9000],
            lookLonLat: [9.08, 46.46, 0]
        },
        color: [1.0, 1.0, 1.0, 1.0],
        renderMode: "color",
        priority: 0,
        sourceEnabled: true,
        video: createVideo("./smpte_360p.mp4")
    });
    renderer.projectors.add(videoProjector);
    setProjectorLens(videoProjector, 640, 360);

    //
    // Image projector. An image, canvas, ImageBitmap or VideoFrame is uploaded once.
    //
    const imageProjector = new Projector({
        enabled: true,
        depthCamera: {
            showFrustum: true,
            showFootprint: false,
            frustumColor: "rgba(140,190,255,0.7)",
            near: 100,
            far: 100000,
            depthBiasWorld: 100.0,
            normalBias: 0.45,
            lonLat: [9.17, 46.45, 9000],
            lookLonLat: [9.17, 46.46, 0]
        },
        color: [1.0, 1.0, 1.0, 1.0],
        renderMode: "color",
        priority: 0,
        sourceEnabled: true,
        image: createImage("./grid.jpg")
    });
    renderer.projectors.add(imageProjector);
    setProjectorLens(imageProjector, 640, 448);

    //
    // Texture projector. A ready WebGL texture is sampled as is and never deleted by the
    // projector manager. Here a small shader draws animated rings into the texture every frame.
    //
    const handler = renderer.handler;

    handler.addProgram(new ShaderProgram("projectorRings", {
        uniforms: {
            time: "float"
        },
        attributes: {
            corners: "vec2"
        },
        vertexShader: `attribute vec2 corners;
            varying vec2 uv;
            void main(void) {
                uv = corners * 0.5 + 0.5;
                gl_Position = vec4(corners, 0.0, 1.0);
            }`,
        fragmentShader: `precision highp float;
            uniform float time;
            varying vec2 uv;
            void main(void) {
                float r = length(uv - 0.5);
                float rings = 0.5 + 0.5 * sin(40.0 * r - 4.0 * time);
                vec3 color = 0.5 + 0.5 * cos(time + 6.28 * uv.x + vec3(0.0, 2.0, 4.0));
                gl_FragColor = vec4(color * rings, 1.0);
            }`
    }));

    const ringsFramebuffer = new Framebuffer(handler, {
        width: 512,
        height: 512,
        useDepth: false,
        targets: [{filter: "LINEAR"}]
    });
    ringsFramebuffer.init();

    // The rings are drawn before the frame, the projector samples them in the same frame
    renderer.events.on("predraw", () => {
        const gl = handler.gl;
        const sh = handler.programs.projectorRings;

        ringsFramebuffer.activate();
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.BLEND);

        sh.activate();
        gl.bindBuffer(gl.ARRAY_BUFFER, renderer.screenFramePositionBuffer);
        gl.vertexAttribPointer(sh.attributes.corners, 2, gl.FLOAT, false, 0, 0);
        gl.uniform1f(sh.uniforms.time, performance.now() / 1000);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        ringsFramebuffer.deactivate();
        gl.enable(gl.DEPTH_TEST);
        renderer.enableBlendDefault();
    });

    const textureProjector = new Projector({
        enabled: true,
        depthCamera: {
            showFrustum: true,
            showFootprint: false,
            frustumColor: "rgba(235,160,255,0.7)",
            near: 100,
            far: 100000,
            depthBiasWorld: 100.0,
            normalBias: 0.45,
            lonLat: [9.26, 46.45, 9000],
            lookLonLat: [9.26, 46.46, 0]
        },
        color: [1.0, 1.0, 1.0, 1.0],
        renderMode: "color",
        priority: 0,
        sourceEnabled: true,
        texture: ringsFramebuffer.textures[0]
    });
    renderer.projectors.add(textureProjector);
    setProjectorLens(textureProjector, 512, 512);
</script>
</body>
</html>
