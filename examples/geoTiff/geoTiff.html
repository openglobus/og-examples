<html>
<head>
    <title>GeoTIFF / COG | OpenGlobus Example</title>
    <meta name="description" content="OpenGlobus example: the simplest way to show a cloud optimized GeoTIFF (COG) on the globe." />
    <meta name="keywords" content="GeoTIFF, COG, cloud optimized geotiff, raster, Layer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css">
</head>

<body>
<div id="globus" style="width:100%;height:100%"></div>

<script type="module" id="og-sandbox-script">
    import {
        Globe,
        GlobusRgbTerrain,
        OpenStreetMap,
        GeoTIFFLayer
    } from "../../external/og/lib/og.es.js";

    var globus = new Globe({
        target: "globus",
        name: "Earth",
        terrain: new GlobusRgbTerrain(),
        layers: [new OpenStreetMap()],
        resourcesSrc: "../../external/og/lib/res",
        fontsSrc: "../../external/og/lib/res/fonts"
    });

    // Single band COG with annual solar power potential.
    // The file is not downloaded completely, only the needed parts are read with HTTP range requests.
    var cog = new GeoTIFFLayer("Solar Power Potential", {
        // url of the GeoTIFF file
        url: "https://eox-gtif-public.s3.eu-central-1.amazonaws.com/DHI/v2/SolarPowerPotential_Annual_COG_clipped_3857_fixed.tif",
        opacity: 0.8,
        renderOptions: {
            // pixels with this value are transparent
            nodata: 0.00010976348130498081,
            single: {
                // band number, starts from 1
                band: 1,
                // color palette for the band values, available:
                // viridis, inferno, turbo, magma, plasma, rainbow, jet, hsv, hot, cool,
                // spring, summer, autumn, winter, bone, copper, greys, ylgnbu, greens, ylorrd,
                // bluered, rdbu, picnic, portland, blackbody, earth, electric, redblue, coolwarm
                colorScale: "viridis"
            }
        }
    });

    globus.planet.addLayer(cog);

    // whenReady() resolves when the file header is read, then the layer extent is known
    cog.whenReady().then(function () {
        globus.planet.flyExtent(cog.getExtent());
    });
</script>
</body>

</html>
