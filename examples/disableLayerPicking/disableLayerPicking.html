<html>
<head>
    <title>Disable Layer Picking | OpenGlobus Example</title>
    <meta name="description" content="OpenGlobus example: Disable Layer Picking." />
    <meta name="keywords" content="layer, disable, picking" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css" type="text/css" />
    <style>
        #layerName {
            position: absolute;
            color: black;
            background-color: white;
            z-index: 100;
            padding: 10px;
            font-size: 18px;
            margin: 15px;
        }
    </style>
</head>

<body>
    <div id="layerName"></div>
    <div id="globus" style="width:100%;height:100%"></div>
    <script type="module" id="og-sandbox-script">
        'use strict';

        import {
            Globe,
            GlobusRgbTerrain,
            OpenStreetMap,
            Vector,
            control,
        } from "../../external/og/lib/og.es.js";

        const osm = new OpenStreetMap();

        const pickableLayer = new Vector("Blue geometry", {
            fading: true,
            visibility: true,
            zIndex: 1,
            pickingEnabled: true,
            entities: [{
                geometry: {
                    type: "Polygon",
                    coordinates: [[
                        [42.38, 43.28],
                        [42.52, 43.28],
                        [42.52, 43.37],
                        [42.38, 43.37],
                        [42.38, 43.28]
                    ]],
                    style: {
                        lineWidth: 8,
                        fillColor: "rgba(0, 130, 210, 0.6)",
                        lineColor: "rgb(0, 90, 190)"
                    }
                }
            }]
        });

        const nonPickableLayer = new Vector("Red geometry", {
            extent: [[42.37, 43.27], [42.53, 43.38]],
            fading: true,
            visibility: true,
            zIndex: 2,
            pickingEnabled: false,
            entities: [{
                geometry: {
                    type: "Polygon",
                    coordinates: [[
                        [42.4, 43.3],
                        [42.42, 43.34],
                        [42.44, 43.35],
                        [42.49, 43.34],
                        [42.5, 43.302],
                        [42.4, 43.3]
                    ]],
                    style: {
                        lineWidth: 8,
                        fillColor: "rgba(190, 0, 0, 0.6)",
                        lineColor: "red"
                    }
                }
            }]
        });

        const globus = new Globe({
            target: "globus",
            name: "Earth",
            terrain: new GlobusRgbTerrain(),
            layers: [osm, pickableLayer, nonPickableLayer],
            resourcesSrc: "../../external/og/lib/res",
            fontsSrc: "../../external/og/lib/res/fonts"
        });

        globus.planet.addControl(new control.LayerSwitcher());

        const layerName = document.getElementById("layerName");

        globus.planet.renderer.events.on("mousemove", function (e) {
            const pickedLayer = e.pickingObject?.layer || e.pickingObject;
            layerName.textContent = pickedLayer?.name || "";
        });

        globus.planet.flyExtent(nonPickableLayer.getExtent());
    </script>
</body>

</html>
