<html>
<head>
    <title>GeoTIFF Mosaic | OpenGlobus Example</title>
    <meta name="description" content="OpenGlobus example: several neighbouring cloud optimized GeoTIFF files shown as one mosaic layer." />
    <meta name="keywords" content="GeoTIFF, COG, mosaic, sources, proj4, EPSG:2193, Layer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../external/og/lib/og.css">
</head>

<body>
<div id="globus" style="width:100%;height:100%"></div>

<div id="loading" style="position:absolute;top:10px;left:50%;transform:translateX(-50%);background-color:white;padding:10px;">LOADING...</div>

<script type="module" id="og-sandbox-script">
    import {
        Globe,
        GlobusRgbTerrain,
        OpenStreetMap,
        GeoTIFFLayer,
        proj4
    } from "../../external/og/lib/og.es.js";

    // The files are in New Zealand Transverse Mercator (EPSG:2193), a projection the layer does
    // not know by itself. Its definition goes to the proj4 openglobus transforms coordinates
    // with, the one bundled in the library.
    proj4.defs(
        "EPSG:2193",
        "+proj=tmerc +lat_0=0 +lon_0=173 +k=0.9996 +x_0=1600000 +y_0=10000000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs"
    );

    var globus = new Globe({
        target: "globus",
        name: "Earth",
        terrain: new GlobusRgbTerrain(),
        layers: [new OpenStreetMap()],
        resourcesSrc: "../../external/og/lib/res",
        fontsSrc: "../../external/og/lib/res/fonts"
    });

    var mosaic = new GeoTIFFLayer("Mosaic", {
        // mosaic: true - files are placed side by side as one image.
        // Without it the files are stacked as bands of one image (see GeoTIFF Stacked Bands example).
        mosaic: true,
        // list of the files, two neighbouring map sheets
        sources: [
            { src: "https://tile-service-raster.s3.us-east-1.amazonaws.com/cogs/as-raster-tile/HM_COG.tif" },
            { src: "https://tile-service-raster.s3.us-east-1.amazonaws.com/cogs/as-raster-tile/HN_COG.tif" }
        ],
        renderOptions: {
            single: {
                band: 1,
                // color palette for the band values, available:
                // viridis, inferno, turbo, magma, plasma, rainbow, jet, hsv, hot, cool,
                // spring, summer, autumn, winter, bone, copper, greys, ylgnbu, greens, ylorrd,
                // bluered, rdbu, picnic, portland, blackbody, earth, electric, redblue, coolwarm
                colorScale: "viridis"
            }
        }
    });

    globus.planet.addLayer(mosaic);

    // getExtent() returns the extent of the whole mosaic
    mosaic.whenReady().then(function () {
        document.getElementById("loading").style.display = "none";
        globus.planet.flyExtent(mosaic.getExtent());
    });
</script>
</body>

</html>
